<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>吳育安 — 職涯作品集</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+TC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    /* ── HERO ── */
    .hero{
      min-height:calc(100vh - var(--nav-h));
      display:flex;align-items:center;
      position:relative;overflow:hidden;
      padding:60px 0;
    }
    .hero-noise{
      position:absolute;inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
      pointer-events:none;
    }
    .hero-line{
      position:absolute;right:0;top:0;bottom:0;width:1px;
      background:linear-gradient(to bottom,transparent,var(--accent),transparent);
      opacity:.25;
    }
    .hero-content{position:relative;z-index:2}
    .hero-tag{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 14px;border:1px solid var(--line);border-radius:999px;
      font-family:var(--ff-mono);font-size:.72rem;color:var(--text3);
      margin-bottom:28px;letter-spacing:.06em;
    }
    .hero-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
    .hero-name{
      font-family:var(--ff-head);
      font-size:clamp(3.5rem,10vw,7.5rem);
      font-weight:700;line-height:.95;
      letter-spacing:-.03em;
      margin-bottom:24px;
    }
    .hero-name em{color:var(--accent);font-style:italic}
    .hero-roles{
      font-family:var(--ff-mono);font-size:.88rem;
      color:var(--text2);letter-spacing:.06em;
      margin-bottom:40px;
    }
    .hero-roles span{color:var(--text3);margin:0 10px}
    .hero-cards{
      display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
      margin-top:64px;
    }
    .h-card{
      background:var(--bg-card);border:1px solid var(--line);
      border-radius:var(--r);padding:20px;
      transition:border-color .2s,transform .2s;
      cursor:default;
    }
    .h-card:hover{border-color:rgba(232,124,58,.3);transform:translateY(-2px)}
    .h-card-num{
      font-family:var(--ff-head);font-size:2.2rem;font-weight:700;
      color:var(--accent);line-height:1;margin-bottom:6px;
    }
    .h-card-label{font-size:.82rem;color:var(--text2)}
    /* nav items */
    .nav-pages{
      display:grid;grid-template-columns:1fr 1fr;gap:14px;
      margin-top:64px;
    }
    .np-item{
      display:flex;align-items:center;justify-content:space-between;
      background:var(--bg-card);border:1px solid var(--line);
      border-radius:var(--r);padding:22px 24px;
      transition:border-color .2s,background .2s;
    }
    .np-item:hover{border-color:var(--accent);background:var(--accent-lt)}
    .np-num{font-family:var(--ff-mono);font-size:.7rem;color:var(--text3);margin-bottom:4px}
    .np-title{font-family:var(--ff-head);font-size:1.1rem;color:var(--text)}
    .np-arrow{font-size:1.4rem;color:var(--accent);transition:transform .2s}
    .np-item:hover .np-arrow{transform:translateX(4px)}

    @media(max-width:768px){
      .hero-name{
        font-family:var(--ff-head);
        font-size:clamp(1.4rem,3vw,2rem);
        font-weight:700;
        margin-bottom:10px;
      }
      .hero-cards{grid-template-columns:1fr 1fr}
      .nav-pages{grid-template-columns:1fr}
    }
    @media(max-width:480px){
      .hero-cards{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

      </div>

      <div class="nav-pages reveal">

        <a href="job.html" class="np-item">

        <a href="plan.html" class="np-item">

  <footer class="footer">
